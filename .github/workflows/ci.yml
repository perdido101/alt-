name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # Applies all migrations + seed to a throwaway Postgres and runs the RLS/RPC tests.
      - run: pnpm db:test

  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      # Call-screening decision logic, checked against the same fixtures as packages/core.
      - run: gradle -p apps/mobile/modules/call-shield/logic test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alt/web exec playwright install --with-deps chromium
      # Builds and serves the site without any accounts (bundled content, demo data source).
      - run: pnpm --filter @alt/web test:e2e

  swift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      # iOS Call Directory list builder (pure Foundation, runs on Linux).
      - run: bash apps/mobile/modules/call-shield/ios-tests/run.sh
